user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # --- Real client IP resolution ---
    # This container is only reachable through the Coolify/Traefik proxy, so the
    # TCP peer is always the proxy and $remote_addr would otherwise be identical
    # for every visitor - collapsing all rate limits into a single global bucket.
    # Trust the proxy and take the client IP from X-Forwarded-For instead.
    #
    # real_ip_recursive is deliberately OFF: with it off nginx uses the LAST
    # entry in X-Forwarded-For, which is the one the proxy itself appended (the
    # real TCP peer). Turning it on would walk left through client-supplied
    # values, allowing anyone to spoof their IP and bypass rate limiting.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Exempt loopback traffic (container healthchecks, SSR-originated calls)
    # from rate limiting: an empty key disables limit_req for that request.
    geo $is_external_client {
        default   1;
        127.0.0.1 0;
        ::1       0;
    }
    map $is_external_client $limit_key {
        0 "";
        1 $binary_remote_addr;
    }

    # Rate limiting zones
    # Authentication endpoints: 5 requests per minute per IP
    limit_req_zone $limit_key zone=auth_limit:10m rate=5r/m;

    # Password reset: 1 request per minute per IP (very strict - with burst=2 allows ~3 requests)
    limit_req_zone $limit_key zone=reset_limit:10m rate=1r/m;

    # General API: 20 requests per second per IP.
    # NOTE: nginx normalises rates to milliseconds, so the old "60r/m" was not
    # "60 requests then rest" - it was a hard 1 request/second cap. A single
    # dashboard load fires ~7 parallel calls, which drained it instantly.
    limit_req_zone $limit_key zone=api_limit:10m rate=20r/s;

    # Use standard log format and log to stdout
    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    log_format debug '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" - upstream: $upstream_addr upstream_status: $upstream_status';
    access_log /dev/stdout main;

    server {
        listen 80;
        server_name _;

        # Limit request body to a reasonable size for a JSON API
        client_max_body_size 1M;
        client_body_buffer_size 128k;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Proxy /api/ to backend
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Pass through all response codes (don't intercept errors)
            proxy_intercept_errors off;

            # General API rate limiting (allow bursts)
            limit_req zone=api_limit burst=30 nodelay;
            limit_req_status 429;
        }

        # Strict rate limiting for registration
        location /api/user/register {
            limit_req zone=auth_limit burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Strict rate limiting for login
        location /api/user/login {
            limit_req zone=auth_limit burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Very strict rate limiting for password reset
        location /api/auth/resetPassword {
            limit_req zone=reset_limit burst=1 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Strict rate limiting for password verification / update
        location /api/auth/updatePassword {
            limit_req zone=reset_limit burst=1 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy all other requests to SvelteKit SSR frontend
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for SSR
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
