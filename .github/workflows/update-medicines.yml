name: Update Medicines Database

on:
  schedule:
    # Run on the 1st of every month at 2 AM UTC
  - cron: 0 2 1 * *
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-medicines:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download and convert medicines data
      working-directory: scripts
      run: |
        echo "Downloading metadata.csv from Dutch medicines database..."
        curl -L -o metadata.csv "https://www.geneesmiddeleninformatiebank.nl/metadata.csv"

        echo "Converting to JSON..."
        python3 convert-metadata-to-json.py

        echo "Verifying JSON output..."
        ls -lh medicines.json
        head -20 medicines.json

        echo "Creating SQLite database for memory-efficient searches..."
        chmod +x migrate-medicines-to-sqlite.py
        MEDICINES_DATA_DIR=. python3 migrate-medicines-to-sqlite.py

        echo "Verifying database..."
        ls -lh medicines.db
        sqlite3 medicines.db "SELECT COUNT(*) as total FROM medicines;"

    - name: Move database files to data directory
      run: |
        mkdir -p data
        mv scripts/medicines.json data/medicines.json || true
        mv scripts/medicines.db data/medicines.db
        ls -lh data/

    - name: Upload medicines database as artifact
      uses: actions/upload-artifact@v4
      with:
        name: medicines-database
        path: |
          data/medicines.json
          data/medicines.db
        retention-days: 90

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update medicines database - ${{ github.run_id }}
        branch: chore/update-medicines-${{ github.run_id }}
        delete-branch: true
        title: 'chore: update medicines database (${{ github.run_id }})'
        body: |
          Automated monthly update of the medicines database from the Dutch medicines information bank.

          Please verify the database record count looks reasonable before merging.
        labels: automated
